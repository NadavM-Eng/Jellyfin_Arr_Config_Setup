services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Jerusalem}
    
      # qBittorrent Web UI
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT:-8080}
      
      # Incoming BitTorrent connections
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT:-6881}
    
    volumes:
      - type: bind
        source: ${CONFIG_ROOT}/qbittorrent
        target: /config

      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /data/torrents

    ports:
      # Web UI
      - "${QBITTORRENT_WEBUI_PORT:-8080}:${QBITTORRENT_WEBUI_PORT:-8080}"
      
      # Torrent incoming connections
      - "${QBITTORRENT_TORRENTING_PORT:-6881}:${QBITTORRENT_TORRENTING_PORT:-6881}"
      - "${QBITTORRENT_TORRENTING_PORT:-6881}:${QBITTORRENT_TORRENTING_PORT:-6881}/udp"

    stop_grace_period: 30s

    restart: unless-stopped

    networks:
      - media_network