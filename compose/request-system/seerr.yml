services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr

    init: true

    environment:
      - LOG_LEVEL=${SEERR_LOG_LEVEL:-debug}
      - TZ=${TZ:-Asia/Jerusalem}

    volumes:
      - type: bind
        source: ${CONFIG_ROOT}/seerr
        target: /app/config

    ports:
      - "${SEERR_PORT:-5055}:5055"

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

    restart: unless-stopped

    networks:
      - media_network