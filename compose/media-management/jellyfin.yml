services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls50
    container_name: jellyfin

    environment:
      - PUID=${PUID:-1000} # gets the PUID from .env file. Otherwise default to 1000.
      - PGID=${PGID:-1000} # gets the PGID from .env file. Otherwise default to 1000.
      - TZ=${TZ:-Asia/Jerusalem}

    volumes:
      - type: bind
        source: ${CONFIG_ROOT}/jellyfin
        target: /config

      - type: bind
        source: ${DATA_ROOT}/media
        target: /data/media

    ports:
      - "${JELLYFIN_PORT:-8096}:8096"

    restart: unless-stopped

    networks:
      - media_network
